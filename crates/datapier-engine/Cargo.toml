[package]
name = "datapier-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
datapier-core = { path = "../datapier-core" }
directories.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }
[dev-dependencies]
sqlx.workspace = true
