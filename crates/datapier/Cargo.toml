[package]
name = "datapier"
version.workspace = true
default-run = "datapier"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
base16ct.workspace = true
base64.workspace = true
clap.workspace = true
datapier-core = { path = "../datapier-core" }
datapier-engine = { path = "../datapier-engine" }
datapier-mcp = { path = "../datapier-mcp" }
datapier-tsp = { path = "../datapier-tsp" }
datapier-tui = { path = "../datapier-tui" }
fs2.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
