[workspace]
members = [
  "crates/datapier",
  "crates/datapier-core",
  "crates/datapier-engine",
  "crates/datapier-mcp",
  "crates/datapier-tsp",
  "crates/datapier-tui",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22"
bigdecimal = { version = "0.4", features = ["serde"] }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
csv = "1"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = { version = "4.2", features = ["v1"] }
quick-xml = { version = "=0.42.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "cookies",
  "form",
  "query",
  "stream",
] }
resvg = { version = "=0.49.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
roxmltree = "=0.21.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
sqlformat = "=0.5.0"
sqlparser = { version = "0.62", features = ["visitor"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "mysql",
  "mysql-rsa",
  "sqlite-bundled",
  "bigdecimal",
  "chrono",
  "json",
] }
tern-sdk = "=0.2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
totp-rs = { version = "=6.0.0", default-features = false, features = ["std", "zeroize"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
