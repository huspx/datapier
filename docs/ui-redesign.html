<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datapier · UI 设计稿</title>
    <style>
    :root {
      color-scheme: dark;
      --bg: #151820;
      --panel: #1d2028;
      --card: #1d2028;
      --hover: rgba(232, 236, 244, 0.05);
      --fg: #e8ecf4;
      --muted: #9ca3b0;
      --border: rgba(232, 236, 244, 0.09);
      --accent: #00b4ff;
      --surface: #1d2028;
      --success: #00ff88;
      --warning: #ffb347;
      --error: #ff4757;
      --selected: rgba(0, 180, 255, 0.34);
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font:
        13px/1.5 "Geist",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        sans-serif;
    }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    /* 浏览器预览模拟 Tern 的默认 md 控件；原生界面由宿主绘制。 */
    button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      padding: 0 10px;
      white-space: nowrap;
    }
    button:hover {
      background: var(--hover);
    }
    button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    input:not([type="checkbox"]), select, textarea {
      min-width: 0;
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      padding: 6px 10px;
    }
    input::placeholder {
      color: var(--muted);
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
      width: 14px;
      height: 14px;
      margin: 0;
      vertical-align: middle;
    }
    svg {
      width: 16px;
      height: 16px;
      flex: none;
      vertical-align: middle;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spacer {
      flex: 1;
    }
    .muted {
      color: var(--muted);
    }
    .mono, pre, code {
      font-family: var(--mono);
    }
    .small {
      font-size: 11px;
    }
    .icon-button {
      width: 28px;
      height: 28px;
      padding: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .icon-button svg {
      width: 14px;
      height: 14px;
    }
    .primary {
      color: var(--bg);
      background: var(--accent);
      font-weight: 600;
    }
    .primary:hover {
      background: var(--accent);
      filter: brightness(1.08);
    }
    .button {
      border-color: var(--border);
      background: var(--card);
    }
    .tag {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      white-space: nowrap;
    }
    .good {
      color: var(--success);
    }
    .warn {
      color: var(--warning);
    }
    .danger {
      color: var(--error);
    }
    button.danger, .context-menu button.danger {
      color: #ef6b73;
    }
    button.primary.danger {
      background: transparent;
      border-color: #ef6b73;
    }
    .preview {
      min-height: 48px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview strong {
      font-weight: 600;
    }
    .preview select {
      font-size: 11px;
      padding: 4px 6px;
    }
    .shell {
      height: calc(100dvh - 49px);
      min-height: 500px;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    .sidebar {
      width: 224px;
      flex: none;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: auto;
    }
    .brand {
      height: 62px;
      width: calc(100% + 16px);
      margin: -8px -8px 0;
      padding: 12px 16px;
      border-radius: 0;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      text-align: left;
    }
    .brand-mark {
      display: block;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.3px;
    }
    .section-heading {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      color: var(--muted);
      font-size: 11px;
      min-height: 32px;
    }
    .section-heading .icon-button {
      height: 24px;
      width: 24px;
      padding: 4px;
    }
    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      width: 100%;
      min-height: 50px;
      padding: 6px 8px;
    }
    .connection.active {
      background: var(--selected);
    }
    .connection-copy {
      flex: 1;
      min-width: 0;
    }
    .connection-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .connection-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .connection-state {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
      font-size: 9px;
    }
    .connection-state::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-connected {
      color: var(--success);
    }
    .status-connecting {
      color: var(--warning);
    }
    .status-failed {
      color: var(--error);
    }
    .status-disconnected {
      color: var(--muted);
    }
    .connection-symbol {
      position: relative;
      display: flex;
      flex: none;
    }
    .connection-badge {
      display: none;
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 9px;
      height: 9px;
      border: 2px solid var(--panel);
      border-radius: 50%;
      background: currentColor;
    }
    .compact .connection-badge {
      display: block;
    }
    .provider-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--card);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex: none;
    }
    .provider-icon img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      pointer-events: none;
    }
    .provider-icon .mysql-mark {
      width: 20px;
      height: 20px;
      color: inherit;
      pointer-events: none;
    }
    .connection-name {
      display: block;
      font-weight: 550;
    }
    .connection-sub {
      display: block;
      margin-top: 2px;
      font: 10px/1.5 var(--mono);
      color: var(--muted);
    }
    .nav-content {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 2px;
    }
    .object-search {
      width: 100%;
      margin: 3px 0 8px;
      font-size: 12px;
    }
    .object-search-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 3px 0 8px;
    }
    .object-search-row .object-search {
      flex: 1;
      min-width: 0;
      margin: 0;
    }
    .tree-line {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 31px;
      width: 100%;
      padding: 4px 8px;
      gap: 7px;
      text-align: left;
      color: var(--muted);
    }
    .tree-line.active {
      background: var(--selected);
      color: var(--fg);
    }
    .tree-line .count {
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
    }
    .tree-line svg {
      width: 14px;
      height: 14px;
    }
    .depth-1 {
      padding-left: 24px;
    }
    .depth-2 {
      padding-left: 42px;
    }
    .nav-footer {
      margin-top: 0;
      border-top: 0;
      padding: 10px 8px 2px;
      color: var(--muted);
      font-size: 10px;
    }
    .sidebar-bottom {
      margin-top: auto;
      width: 100%;
      border-top: 1px solid var(--border);
      padding-top: 5px;
    }
    .sidebar-settings {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 8px;
      text-align: left;
      color: var(--muted);
    }
    .sidebar-settings:disabled {
      opacity: 0.65;
    }
    .sidebar-settings .settings-note {
      margin-left: auto;
      font-size: 9px;
    }
    .compact .sidebar-bottom {
      width: 44px;
    }
    .compact .sidebar-settings {
      justify-content: center;
    }
    .compact .settings-text, .compact .settings-note {
      display: none;
    }
    .database-scope {
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin: 0;
      min-width: 0;
      text-align: left;
    }
    .tls-fields[hidden] {
      display: none;
    }
    details.wide summary {
      cursor: pointer;
      margin-bottom: 8px;
      color: var(--muted);
    }
    .database-scope legend {
      padding: 0 5px;
      font-size: 11px;
      color: var(--muted);
    }
    .database-scope-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .database-scope input[type="search"] {
      width: 100%;
      margin-bottom: 8px;
    }
    .database-options {
      max-height: 150px;
      overflow: auto;
      border-top: 1px solid var(--border);
    }
    .database-option {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      justify-content: flex-start;
      gap: 6px !important;
      width: 100%;
      text-align: left;
    }
    .database-option span {
      color: var(--fg);
    }
    .database-match-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      background: var(--success);
      margin-right: 5px;
    }
    .compact .sidebar {
      width: 58px;
      padding: 8px 6px;
      align-items: center;
    }
    .compact .brand {
      width: calc(100% + 12px);
      margin-left: -6px;
      margin-right: -6px;
      padding-left: 10px;
      padding-right: 10px;
      justify-content: center;
      gap: 0;
    }
    .compact .brand-name,
    .compact .connection-copy,
    .compact .nav-content,
    .compact .nav-footer,
    .compact .connection-heading {
      display: none;
    }
    .compact .connection {
      width: 44px;
      padding: 6px 8px;
      justify-content: center;
    }
    .compact .connections-head {
      padding: 2px 0;
      justify-content: center;
    }
    .compact .connections-head .icon-button {
      width: 32px;
      height: 32px;
    }
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .context {
      min-height: 54px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .context strong {
      font-size: 14px;
      font-weight: 600;
    }
    .breadcrumb {
      color: var(--muted);
      font: 11px var(--mono);
    }
    .db-select {
      min-width: 106px;
      font: 11px var(--mono);
      padding: 5px 8px;
    }
    .tabs {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      min-height: 39px;
      padding: 0 8px;
      gap: 4px;
      flex: none;
    }
    .tab-scroll {
      display: flex;
      overflow: auto;
      scrollbar-width: thin;
      min-width: 0;
      flex: 1;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px 0 3px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      flex: none;
    }
    .tab.active {
      color: var(--fg);
      background: var(--bg);
      border-bottom-color: var(--accent);
    }
    .tab-label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px;
      max-width: 200px;
    }
    .tab-label span {
      text-overflow: ellipsis;
      overflow: hidden;
    }
    .tab .icon-button {
      width: 22px;
      height: 24px;
      padding: 4px;
      color: var(--muted);
    }
    .tab .icon-button svg {
      width: 12px;
      height: 12px;
    }
    .tabs > .icon-button {
      align-self: center;
    }
    .workarea {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .subnav {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 0 18px;
      min-height: 28px;
      height: 28px;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .subnav button {
      height: 27px;
      min-height: 0;
      padding: 3px 2px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      line-height: 17px;
      color: var(--muted);
    }
    .subnav button.active {
      color: var(--fg);
      border-bottom: 2px solid var(--accent);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      min-height: 46px;
      flex-wrap: wrap;
      flex: none;
    }
    .toolbar input[type="search"] {
      width: 210px;
      padding: 5px 9px;
      font-size: 12px;
    }
    .table-wrap {
      overflow: auto;
      min-height: 0;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }
    th {
      height: 42px;
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th, td {
      padding: 0 13px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    th:last-child, td:last-child {
      border-right: 0;
    }
    th small {
      display: block;
      font: 9px var(--mono);
      color: var(--muted);
      margin-top: 2px;
    }
    td {
      height: 35px;
      font: 11px var(--mono);
    }
    tbody tr:hover {
      background: var(--card);
    }
    tr.selected {
      background: var(--selected);
    }
    .number {
      text-align: right;
    }
    .row-number {
      text-align: right;
      width: 36px;
      padding: 0 8px;
      color: var(--muted);
      user-select: none;
      cursor: pointer;
    }
    #mysql-grid td[data-cell] {
      cursor: cell;
    }
    #mysql-grid td[data-cell]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    #mysql-grid td.modified {
      box-shadow: inset 3px 0 var(--warning);
    }
    .schema-preview td:last-child {
      min-width: 200px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .key-folder {
      width: 100%;
      color: var(--muted);
      text-align: left;
    }
    .key-children {
      margin-left: 12px;
      border-left: 1px solid var(--border);
    }
    #mysql-grid td.editing {
      padding: 0;
    }
    .cell-editor {
      width: 100%;
      min-width: 70px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent);
      border-radius: 0;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    .null {
      color: var(--muted);
      font-style: italic;
    }
    .table-footer {
      padding: 5px 16px;
      min-height: 36px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      flex: none;
    }
    .selection-count {
      color: var(--accent);
    }
    .statusbar {
      min-height: 29px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      flex: none;
    }
    .statusbar button {
      font-size: 10px;
      padding: 1px 5px;
    }
    .sql-workbench {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .sql-editor-wrap {
      display: flex;
      flex: 1;
      min-height: 180px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .has-sql-results .sql-editor-wrap {
      flex: 0 0 55%;
    }
    .sql-gutter {
      width: 76px;
      flex: none;
      padding: 14px 4px;
      background: var(--panel);
      overflow: hidden;
      border-right: 1px solid var(--border);
      user-select: none;
    }
    .gutter-line {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font: 11px/24px var(--mono);
      color: var(--muted);
    }
    .gutter-line.current {
      color: var(--accent);
    }
    .gutter-number {
      width: 27px;
      text-align: right;
    }
    .gutter-run, .gutter-gap {
      width: 22px;
      height: 22px;
      padding: 4px;
      flex: none;
    }
    .gutter-run, .cli-run {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .gutter-run svg {
      width: 12px;
      height: 12px;
    }
    .gutter-run:hover, .gutter-line.current .gutter-run, .cli-run:hover {
      color: var(--accent);
    }
    .sql-input-surface {
      flex: 1;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }
    .query-editor, .sql-highlight {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 14px 16px;
      border: 0;
      border-radius: 0;
      font: 12px/24px var(--mono);
      letter-spacing: normal;
      tab-size: 2;
      white-space: pre;
      overflow-wrap: normal;
    }
    .sql-highlight {
      overflow: hidden;
      pointer-events: none;
    }
    .query-editor {
      resize: none;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: var(--fg);
      overflow: auto;
    }
    .query-editor::selection {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .query-editor:focus-visible {
      outline: none;
    }
    .sql-editor-wrap:focus-within {
      box-shadow: inset 0 0 0 1px
        color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .sql-keyword {
      color: var(--accent);
      font-weight: 600;
    }
    .sql-string {
      color: var(--success);
    }
    .sql-number {
      color: var(--warning);
    }
    .sql-comment {
      color: var(--muted);
      font-style: italic;
    }
    .sql-identifier {
      color: var(--fg);
    }
    .sql-editor-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 16px;
      min-height: 30px;
      color: var(--muted);
      font-size: 10px;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .sql-results {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 100px;
      overflow: auto;
    }
    .sql-results-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .sql-execution-text {
      margin: 0;
      padding: 12px 16px;
      font: 12px/24px var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .sql-readonly {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .ddl-gutter {
      min-width: 50px;
      padding: 16px 12px;
      background: var(--panel);
      color: var(--muted);
      font: 11px/24px var(--mono);
      text-align: right;
      white-space: pre;
      user-select: none;
    }
    .ddl-code {
      padding: 16px;
      margin: 0;
      font: 12px/24px var(--mono);
      white-space: pre;
    }
    .provider-field {
      margin: 0;

    <div id="app" class="shell"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/sql-formatter@15.9.0/dist/sql-formatter.min.js"
      integrity="sha256-+VrFvZ1CRzKIfHdQhS5BvkqJFgi3T/ZvXHOrA6NbWMA="
      crossorigin="anonymous"
    ></script>
    <script>
    'use strict';
    const $ = selector => document.querySelector(selector);
    const h = value =>
      String(value).replace(
        /[&<>"']/g,
        c => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[c]),
      );
    function fieldError(field, message) {
      field.setAttribute('aria-invalid', 'true');
      let error = field.parentElement.querySelector('.field-error');
      if (!error) {
        error = document.createElement('span');
        error.className = 'field-error';
        error.setAttribute('role', 'alert');
        field.parentElement.append(error);
      }
      error.textContent = message;
      field.closest('details')?.setAttribute('open', '');
      if (field.closest('[hidden]')) field.closest('[hidden]').hidden = false;
      field.focus();
    }
    function clearFieldErrors() {
      document.querySelectorAll('.field-error').forEach(error =>
        error.remove()
      );
      document.querySelectorAll('[aria-invalid="true"]').forEach(field =>
        field.removeAttribute('aria-invalid')
      );
    }
    function validateConnection() {
      clearFieldErrors();
      const form = state.connectionForm;
      const required = language === 'zh-CN'
        ? '此项不能为空。'
        : 'This field is required.';
      for (const name of ['name', 'host']) {
        if (!form[name].trim()) {
          fieldError(
            document.querySelector(`[data-connection-field="${name}"]`),
            required,
          );
          return false;
        }
      }
      if (
        !/^\d+$/.test(form.port) || Number(form.port) < 1
        || Number(form.port) > 65535
      ) {
        fieldError(
          document.querySelector('[data-connection-field="port"]'),
          language === 'zh-CN'
            ? '请输入 1–65535 的端口。'
            : 'Enter a port from 1 to 65535.',
        );
        return false;
      }
      if (
        (!form.tls && (form.ca || form.cert || form.key))
        || Boolean(form.cert) !== Boolean(form.key)
      ) {
        const field = document.querySelector(
          `[data-connection-field="${
            !form.tls
              ? (form.ca ? 'ca' : form.cert ? 'cert' : 'key')
              : form.cert
              ? 'key'
              : 'cert'
          }"]`,
        );
        fieldError(
          field,
          language === 'zh-CN'
            ? '启用 TLS 并成对提供证书和密钥。'
            : 'Enable TLS and provide both certificate and key.',
        );
        return false;
      }
      return true;
    }
    function validateTransfer(path) {
      clearFieldErrors();
      if (!path.value.trim()) {
        fieldError(
          path,
          language === 'zh-CN' ? '请输入文件路径。' : 'Enter a file path.',
        );
        return false;
      }
      for (
        const [id, valid] of [[
          'transfer-mapping',
          value => value && typeof value === 'object' && !Array.isArray(value),
        ], [
          'transfer-binary',
          value =>
            Array.isArray(value)
            && value.every(item => typeof item === 'string'),
        ]]
      ) {
        const field = document.getElementById(id);
        if (!field) continue;
        try {
          if (valid(JSON.parse(field.value))) continue;
        } catch {}
        fieldError(
          field,
          language === 'zh-CN'
            ? '请输入有效的 JSON 配置。'
            : 'Enter valid JSON configuration.',
        );
        return false;
      }
      return true;
    }

    function scanSql(sql) {

      let offset = 0, error = '';
      while (offset < sql.length) {
        const start = offset;
        let kind = '', closed = true;
        const rest = sql.slice(offset);
        if (/^\s/.test(rest)) offset += rest.match(/^\s+/)[0].length;
        else if (rest[0] === '#' || /^--[\s\u0000-\u001f]/.test(rest)) {
          kind = 'comment';
          const newline = sql.indexOf('\n', offset);
          offset = newline === -1 ? sql.length : newline;

          kind = 'comment';
          const end = sql.indexOf('*/', offset + 2);
          if (/^\/\*(?:[!+]|[Mm]!)/.test(rest)) {
            error ||= t('executableComment');
          }
          if (end === -1) {
            offset = sql.length;
            error ||= t('unclosedComment');
          } else {
            if (sql.slice(offset + 2, end).includes('/*')) {
              error ||= t('nestedComment');
            }
            offset = end + 2;
          }
        } else if (["'", '"', '`'].includes(rest[0])) {
          const quote = rest[0];
          kind = quote === '`' ? 'identifier' : 'string';
          offset++;
          closed = false;
          while (offset < sql.length) {
            if (sql[offset] === quote) {
              if (sql[offset + 1] === quote) offset += 2;
              else {
                offset++;
                closed = true;
                break;
              }
            } else if (sql[offset] === '\\' && quote !== '`') {
              offset = Math.min(sql.length, offset + 2);
            } else offset++;
          }
          if (!closed) error ||= t('unclosedQuote');
        } else if (/^[A-Za-z_$\u0080-\uffff]/.test(rest)) {
          const word = rest.match(/^[A-Za-z0-9_$\u0080-\uffff]+/)[0];
          offset += word.length;
          kind = sqlKeywords.has(word.toUpperCase()) ? 'keyword' : 'word';
        } else if (/^\d/.test(rest)) {
          kind = 'number';
          offset += rest.match(
            /^(?:0x[\da-f]+|0b[01]+|\d+(?:\.\d*)?(?:e[+-]?\d+)?)/i,
          )[0].length;
        } else {
          offset++;
          if (rest[0] === '\\') {
            error ||= t('clientEscape');
          }
        }
        tokens.push({
          start,
          end: offset,
          kind,
          text: sql.slice(start, offset),
        });
      }
      const words = tokens.filter(t =>
        ['word', 'keyword', 'identifier'].includes(t.kind)
      ).map(t => t.text.replace(/^`|`$/g, '').toUpperCase());

        words.some(w => ['DELIMITER', 'SOURCE', 'SQL_MODE'].includes(w))
        || /^\s*\\\./m.test(sql)

        words.includes('CREATE')

          ['PROCEDURE', 'FUNCTION', 'TRIGGER', 'EVENT'].includes(w)

      let segment = [];
      const finish = (scopeEnd = sql.length) => {
        const meaningful = segment.filter(t =>
          t.kind !== 'comment' && t.text.trim()

        if (meaningful.length) {
          const start = meaningful[0].start, end = meaningful.at(-1).end;
          statements.push({
            start,
            end,
            scopeStart: segment[0].start,
            scopeEnd,
            line: sql.slice(0, start).split('\n').length,
            lastLine: sql.slice(0, end).split('\n').length,
          });
        }
        segment = [];
      };
      for (const token of tokens) {
        if (!token.kind && token.text === ';') finish(token.start);
        else segment.push(token);
      }

      const parsed = scanSql(tab.sql);
      let sql = '', labelKey = '', labelValues = {};
      if (scope === 'selection') {
        sql = tab.sql.slice(tab.sqlStart, tab.sqlEnd);
        labelKey = 'executeSelectedSql';
      } else if (scope === 'explain-selection' || scope === 'explain') {
        const selected = scope === 'explain-selection'
          ? tab.sql.slice(tab.sqlStart, tab.sqlEnd)
          : explainTarget(tab, parsed);
        if (!explainableSelection(selected)) {
          toast(t('explainLimit'));
          return;
        }
        sql = 'EXPLAIN FORMAT=JSON\n' + selected;
        labelKey = 'explainPlan';
      } else if (scope === 'all') {
        sql = tab.sql;
        labelKey = 'executeAllSql';
      } else {
        const statement = scope === 'current'
          ? parsed.statements.find(s =>
            tab.sqlEnd >= s.scopeStart && tab.sqlEnd <= s.scopeEnd
          )
          : parsed.statements[index];
        if (!statement) {
          toast(parsed.error || t('noCurrentSql'));
          return;
        }
        sql = tab.sql.slice(statement.start, statement.end);
        labelKey = 'runStatementLines';
        labelValues = {
          number: parsed.statements.indexOf(statement) + 1,
          start: statement.line,
          end: statement.lastLine,
        };
      }
      if (!sql.trim()) {
        toast(t('noSelectedSql'));
        return;
      }
      tab.execution = { sql, labelKey, labelValues };
      tab.resultFixture = false;
      state.overlay = null;
      state.menu = null;
      render();
    }

    let gridMeasureCache = null;
    function fitGrid() {
      const table = $('#mysql-grid') || $('#result-grid');
      if (!table || state.cellEdit) return;
      const result = table.id === 'result-grid';
      const columns = [...table.querySelectorAll('col[data-grid-column]')];
      const rows = result
        ? orders.filter(row =>
          row.status === 'paid'
          && Object.values(row).some(v =>
            String(v).toLowerCase().includes(state.resultFilter.toLowerCase())
          )
        )
        : currentRows();
      const key = result ? 'result' : `${state.database}.${state.table}`;
      const numberWidth = result ? 0 : 38;
      const signature = JSON.stringify([
        key,
        columns.map(c => c.dataset.gridColumn),
        rows.map(row => columns.map(col => row[col.dataset.gridColumn])),
      ]);
      if (gridMeasureCache?.signature !== signature) {
        const units = text =>
          [...String(text)].slice(0, 66).reduce(
            (n, c) => n + (c.codePointAt(0) < 128 ? 1 : 2),
            0,
          );
        const headers = [...table.querySelectorAll('thead th')].slice(
          result ? 0 : 1,
        );
        gridMeasureCache = {
          signature,
          widths: columns.map((col, i) => {
            const name = col.dataset.gridColumn;
            const type = headers[i]?.querySelector('small')?.textContent || '';
            return Math.min(
              480,
              Math.max(
                64,
                units(name) * 7 + 24,
                units(type) * 5 + 24,
                ...rows.map(row =>
                  Math.min(66, row[name] == null ? 5 : units(row[name])) * 7
                  + 24
                ),
              ),
            );
          }),
        };
      }
      const widths = gridMeasureCache.widths.map((width, i) =>
        state.columnWidths[key]?.[columns[i].dataset.gridColumn] ?? width
      );
      const flexible = widths.map((w, i) => i).filter(i =>
        state.columnWidths[key]?.[columns[i].dataset.gridColumn] == null
      );
      let remaining = Math.max(
        flexible.reduce((n, i) => n + widths[i], 0),
        table.parentElement.clientWidth - numberWidth
          - widths.reduce((n, w, i) => n + (flexible.includes(i) ? 0 : w), 0),
      );
      let weight = flexible.reduce((n, i) => n + widths[i], 0);
      let pending = [...flexible];
      while (pending.length) {
        const capped = pending.filter(i =>
          remaining * widths[i] >= 480 * weight
        );
        if (!capped.length) break;
        for (const i of capped) {
          weight -= widths[i];
          widths[i] = 480;
          remaining -= 480;
        }
        pending = pending.filter(i => !capped.includes(i));
      }
      pending.forEach((i, position) => {
        const natural = widths[i];
        const width = position === pending.length - 1
          ? remaining
          : Math.floor(remaining * natural / weight);
        widths[i] = Math.min(480, Math.max(64, width));
        remaining -= widths[i];
        weight -= natural;
      });
      columns.forEach((col, i) => col.style.width = widths[i] + 'px');
      table.style.width = (numberWidth + widths.reduce((a, b) => a + b, 0))
        + 'px';
    }

      if (!selectedCell || !state.cellSelection) return;
      const s = state.cellSelection;
      const redis = selectedCell.closest('#redis-grid'),
        queryResult = selectedCell.closest('#result-grid');
      const key = redis
        ? `redis:${state.redisDb}:${state.key}`
        : queryResult
        ? `result:${state.active}`
        : `${state.database}.${state.table}`;
      if (s.key !== key) return;
      const rows = [
        ...selectedCell.closest('table').querySelectorAll('tbody tr'),
      ];
      const source = redis
        ? keySamples.find(item => item.name === state.key)?.rows
        : queryResult
        ? orders.filter(row =>
          row.status === 'paid'
          && Object.values(row).some(v =>
            String(v).toLowerCase().includes(state.resultFilter.toLowerCase())
          )
        )
        : currentRows();
      if (!source) return;
      const result = [];
      for (
        let r = Math.min(s.start[0], s.end[0]);
        r <= Math.max(s.start[0], s.end[0]);
        r++
      ) {
        const cells = [...(rows[r]?.querySelectorAll('td[data-cell]') || [])];
        const fields = [];
        for (
          let c = Math.min(s.start[1], s.end[1]);
          c <= Math.max(s.start[1], s.end[1]);
          c++
        ) {
          if (!cells[c] || !source[r]) return;
          const value = source[r][cells[c].dataset.cell];
          if (value === undefined) return;
          const redisType = redis
            && keySamples.find(item => item.name === state.key)?.type;
          const column = Number(cells[c].dataset.cell);
          const bytes = redis && !(redisType === 'LIST' && column === 0)

            ? btoa(
              Array.from(
                new TextEncoder().encode(String(value)),
                byte => String.fromCharCode(byte),

            )

          let text = encoded === null
            ? '\\N'
            : String(encoded).replaceAll('\\', '\\\\');

            text = '"' + text.replaceAll('"', '""') + '"';

      if (key.type === 'STR') {

        try {

        } catch {
          return 'base64:' + base64(key.bytes);
        }
      }
      const entries = key.rows.map(row => {
        if (key.type === 'HASH') {
          return { field_b64: encode(row[0]), value_b64: encode(row[1]) };
        }
        if (key.type === 'LIST') {
          return { index: row[0], value_b64: encode(row[1]) };
        }
        if (key.type === 'SET') return { member_b64: encode(row[0]) };
        return { member_b64: encode(row[0]), score: row[1] };
      });
      return JSON.stringify({ type: key.type.toLowerCase(), entries }, null, 2);

      });

        row => {
          if (key.type === 'HASH') {
            return { field: bytes(row[0]), value: bytes(row[1]) };

          if (key.type === 'LIST') {
            return {
              index: { type: 'integer', value: row[0] },

            member: bytes(row[0]),

    function redisKeyList(keys) {

      const root = { folders: new Map(), leaves: [] };
      for (const key of keys) {
        let node = root, prefix = '';
        const parts = key.name.split(':');
        for (const part of parts.slice(0, -1)) {
          prefix += part + ':';
          if (!node.folders.has(part)) {
            node.folders.set(part, {
              label: part || '∅',
              prefix,
              folders: new Map(),
              leaves: [],
              count: 0,
            });
          }
          node = node.folders.get(part);
          node.count++;
        }
        node.leaves.push(key);
      }
      const renderNode = node =>
        [...node.folders.values()].map(folder => {
          const identity = state.redisDb + '\0' + folder.prefix;
          const expanded = state.expandedKeyFolders.has(identity);
          return `<button class="key-folder row" data-key-folder="${
            h(encodeURIComponent(folder.prefix))

            expanded
              ? `<div class="key-children">${renderNode(folder)}</div>`

      return renderNode(root);

    async function sqlMenuAction(action) {
      const menuState = state.menu, tab = queryTab(), input = $('#sql-query');
      if (
        !tab || !input || menuState?.kind !== 'sql'
        || menuState.tabId !== tab.id
      ) return;
      const { start, end } = menuState;
      const original = tab.sql, selected = original.slice(start, end);
      state.menu = null;
      document.querySelector('.context-menu')?.remove();
      input.focus();
      input.setSelectionRange(start, end);
      tab.sqlStart = start;
      tab.sqlEnd = end;
      if (action === 'sql-menu-execute') return requestSql('selection');
      if (action === 'sql-menu-explain') return requestSql('explain-selection');
      if (action === 'sql-menu-format') {
        try {
          const parsed = scanSql(selected);
          if (parsed.error) throw new Error(parsed.error);
          if (!parsed.statements.length) throw new Error(t('noFormatSql'));
          if (!window.sqlFormatter?.format) {
            throw new Error(t('formatterUnavailable'));
          }
          const leading = selected.match(/^\s*/)[0];
          const trailing = selected.match(/\s*$/)[0];
          const formatted = leading
            + window.sqlFormatter.format(selected.trim(), {
              language: 'mysql',
              keywordCase: 'upper',
              tabWidth: 2,
              linesBetweenQueries: 1,
            }) + trailing;
          const formattedParsed = scanSql(formatted);
          const semicolons = tokens =>
            tokens.filter(t => !t.kind && t.text === ';').length;
          const endsWithSemicolon = tokens => {
            const last = tokens.filter(t =>
              t.kind !== 'comment' && t.text.trim()
            ).at(-1);
            return Boolean(last && !last.kind && last.text === ';');
          };
          if (
            formattedParsed.error
            || semicolons(parsed.tokens) !== semicolons(formattedParsed.tokens)
            || endsWithSemicolon(parsed.tokens)
              !== endsWithSemicolon(formattedParsed.tokens)
          ) {
            throw new Error(t('formatBoundary'));
          }
          if (!document.execCommand('insertText', false, formatted)) {
            throw new Error(t('undoUnsupported'));
          }
          input.setSelectionRange(start, start + formatted.length);
          input.dispatchEvent(new Event('input', { bubbles: true }));
          rememberSqlSelection();
          toast(t('formatted'));
        } catch (error) {
          toast(t('formatFailed', { reason: error.message || String(error) }));
        }
        return;
      }
      if (action === 'sql-menu-all') {
        input.setSelectionRange(0, input.value.length);
        rememberSqlSelection();
        return;
      }
      if (action === 'sql-menu-copy' || action === 'sql-menu-cut') {
        try {
          await navigator.clipboard.writeText(selected);
          if (action === 'sql-menu-cut') {
            if (
              queryTab() !== tab || tab.sql !== original
              || $('#sql-query') !== input
              || input.selectionStart !== start || input.selectionEnd !== end
            ) {
              toast(t('copiedNotCut'));
              return;
            }
            input.setRangeText('', start, end, 'end');
            input.dispatchEvent(new Event('input', { bubbles: true }));
            toast(t('cutDone'));
          } else toast(t('copied'));
        } catch {
          toast(t('clipboardDenied'));
        }
      }
    }

      const q = value =>
        value === null ? 'NULL' : "'" + String(value).replace(/'/g, "''") + "'";
      state.sqlCopy = 'INSERT INTO `' + state.database + '`.`' + state.table
        + '` (' + columns.map(c => '`' + c + '`').join(', ') + ')\nVALUES\n'
        + selected.map(row =>
          '  (' + columns.map(c => q(row[c])).join(', ') + ')'
        ).join(',\n') + ';';
      state.sqlCopyExclude = exclude;
      state.overlay = null;
      state.menu = null;
      render();
      copy(state.sqlCopy);
    }
    document.addEventListener('dblclick', event => {
      const cell = event.target.closest('#mysql-grid td[data-cell]');
      if (!cell || event.target.id === 'grid-cell-editor') return;
      startCellEdit(cell.closest('tr').dataset.row, cell.dataset.cell);
    });
    document.addEventListener('focusout', event => {
      // 整页重绘也会触发失焦；只提交仍在当前表格中的真实编辑框。
      if (event.target.id === 'grid-cell-editor' && event.target.isConnected) {
        finishCellEdit(true);
      }
    });
    function selectRedisItem(setName, anchorName, item, ordered, event) {
      const selected = state[setName];
      const modified = event.metaKey || event.ctrlKey;
      if (event.shiftKey && ordered.includes(state[anchorName])) {
        const a = ordered.indexOf(state[anchorName]), b = ordered.indexOf(item);
        if (!modified) selected.clear();
        ordered.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(value =>
          selected.add(value)
        );
      } else if (modified) {
        selected.has(item) ? selected.delete(item) : selected.add(item);
        state[anchorName] = item;
      } else {
        selected.clear();
        selected.add(item);
        state[anchorName] = item;
      }
    }
    function openRedisKey(key) {
      if (!key) return;
      state.key = key.name;
      let tab = state.tabs.find(item =>
        item.provider === 'redis' && item.key === key.name
        && item.redisDb === state.redisDb
      );
      if (!tab) {
        tab = {
          id: state.nextTab++,
          provider: 'redis',
          title: key.name,
          key: key.name,
          redisDb: state.redisDb,
        };
        state.tabs.push(tab);
      }
      state.active = tab.id;
      state.redisRow = 0;
      state.selectedEntries.clear();
      state.entryAnchor = null;
      state.redisFormat = 'text';
    }
    document.addEventListener('click', event => {
      const folder = event.target.closest('[data-key-folder]');
      if (folder) {
        const identity = state.redisDb + '\0'
          + decodeURIComponent(folder.dataset.keyFolder);
        if (state.expandedKeyFolders.has(identity)) {
          state.selectedKeys.clear();
          state.keyAnchor = null;
        }
        state.expandedKeyFolders.has(identity)
          ? state.expandedKeyFolders.delete(identity)
          : state.expandedKeyFolders.add(identity);
        render();
        return;
      }
      const clickedCell = event.target.closest(
        '#mysql-grid td[data-cell], #result-grid td[data-cell], #redis-grid td[data-cell]',
      );
      if (clickedCell && event.target.id !== 'grid-cell-editor') {
        const redis = clickedCell.closest('#redis-grid'),
          result = clickedCell.closest('#result-grid');
        const key = redis
          ? `redis:${state.redisDb}:${state.key}`
          : result
          ? `result:${state.active}`
          : `${state.database}.${state.table}`;
        const position = gridPosition(clickedCell);
        if (event.shiftKey && state.cellSelection?.key === key) {
          state.cellSelection.end = position;
        } else state.cellSelection = { key, start: position, end: position };
        state.selected.clear();
        state.selectedEntries.clear();
        if (redis) {
          state.redisRow = Number(clickedCell.closest('tr').dataset.redisRow);
        } else if (!result) {
          state.menuRow = clickedCell.closest('tr').dataset.row;
          state.menuCell = clickedCell.dataset.cell;
          const details = document.querySelector(
            '[data-action="inspect-cell"]',
          );
          if (details) details.disabled = false;
        }
        clickedCell.focus();
        paintCellSelection();
        return;
      }
      const redisRow = event.target.closest('[data-redis-row-number]')?.closest(
        '[data-redis-row]',
      );
      if (redisRow) {
        state.cellSelection = null;
        state.redisRow = Number(redisRow.dataset.redisRow);
        selectRedisItem(
          'selectedEntries',
          'entryAnchor',
          state.redisRow,
          [...document.querySelectorAll('[data-redis-row]')].map(row =>
            Number(row.dataset.redisRow)
          ),
          event,
        );
        render();
        return;
      }
      const rowNumber = event.target.closest('[data-select-row]');
      if (rowNumber) {
        state.cellSelection = null;
        selectRow(rowNumber.dataset.selectRow, event);
        return;
      }
      const button = event.target.closest('button');
      if (!button) {
        if (state.menu) {
          state.menu = null;
          document.querySelector('.context-menu')?.remove();
        }
        return;
      }
      if (button.dataset.provider) {
        activateProvider(button.dataset.provider);
        state.menu = null;
        render();
        return;
      }
      if (button.dataset.db) {
        state.expanded.has(button.dataset.db)
          ? state.expanded.delete(button.dataset.db)
          : state.expanded.add(button.dataset.db);
        render();
        return;
      }
      if (button.dataset.openTable) {
        openTable(button.dataset.tableDb, button.dataset.openTable);
        return;
      }
      if (button.dataset.tab) {
        state.active = Number(button.dataset.tab);
        const tab = state.tabs.find(t => t.id === state.active);
        state.provider = tab.provider || 'mysql';
        state.database = tab.database || state.database;
        if (tab.table) state.table = tab.table;
        if (tab.key) {
          state.key = tab.key;
          state.redisDb = tab.redisDb;
          state.selectedEntries.clear();
          state.entryAnchor = null;
        }
        state.selected.clear();
        state.anchor = null;
        state.rowFilter = '';
        render();
        return;
      }
      if (button.dataset.section) {
        state.section = button.dataset.section;
        render();
        return;
      }
      if (button.dataset.keyIndex !== undefined) {
        const key = keySamples[Number(button.dataset.keyIndex)];
        const ordered = [...document.querySelectorAll('[data-key-index]')].map(
          row => keySamples[Number(row.dataset.keyIndex)],
        );
        selectRedisItem('selectedKeys', 'keyAnchor', key, ordered, event);
        if (!event.shiftKey && !event.metaKey && !event.ctrlKey) {
          openRedisKey(key);
        }
        render();
        return;
      }
      if (button.dataset.cliResult !== undefined) {
        state.cliResult = Number(button.dataset.cliResult);
        render();
        return;
      }
      if (button.dataset.history !== undefined) {
        state.historySelected = Number(button.dataset.history);
        render();
        return;
      }
      if (button.dataset.command) {
        state.cliText = button.dataset.command;
        render();
        $('#cli-command')?.focus();
        return;
      }
      if (button.dataset.connectionType) {
        const form = state.connectionForm;
        const oldPort = form.provider === 'mysql' ? '3306' : '6379';
        form.provider = button.dataset.connectionType;
        if (form.port === oldPort) {
          form.port = form.provider === 'mysql'
            ? '3306'
            : '6379';
        }
        render();
        document.querySelector(`[data-connection-type="${form.provider}"]`)
          .focus();
        return;
      }
      const action = button.dataset.action;
      if (!action) return;
      if (action === 'history') {
        state.overlay = 'history';
        render();
        return;
      }
      if (action === 'open-history') {
        const tab = {
          id: state.nextTab++,
          database: 'commerce',
          query: true,
          title: t('queryFile', { number: state.nextTab }),
          sql: historySamples[state.historySelected].sql,
        };
        state.tabs.push(tab);
        state.active = tab.id;
        state.database = tab.database;
        state.overlay = null;
        render();
        return;
      }
      if (action.startsWith('format-')) {
        state.redisFormat = action.slice(7);
        render();
        return;
      }
      if (
        ['table-columns', 'result-columns', 'redis-columns'].includes(action)
      ) {
        const key = keySamples.find(item => item.name === state.key);
        state.columnsTarget = action === 'table-columns'
          ? `${state.database}.${state.table}`
          : action === 'result-columns'
          ? 'result'
          : 'redis:' + key.type;
        state.overlay = 'columns';
        render();
        return;
      }
      if (action === 'apply-columns') {
        const widths = [...document.querySelectorAll('[data-column-width]')];
        const invalidWidth = widths.find(input =>
          input.value
          && (!/^\d+$/.test(input.value) || Number(input.value) < 1
            || Number(input.value) > 65535)
        );
        if (invalidWidth) {
          fieldError(
            invalidWidth,
            language === 'zh-CN'
              ? '请输入 1–65535 的宽度。'
              : 'Enter a width from 1 to 65535.',
          );
          return;
        }
        state.columnWidths[state.columnsTarget] = Object.fromEntries(
          widths.filter(input => input.value).map(
            input => [input.dataset.columnWidth, Number(input.value)],
          ),
        );
        state.hiddenColumns[state.columnsTarget] = [
          ...document.querySelectorAll('[data-column-choice]'),
        ].filter(input => !input.checked).map(input =>
          input.dataset.columnChoice
        );
        state.overlay = null;
        render();
        return;
      }
      if (action.startsWith('redis-menu-')) {
        const menu = state.menu;
        if (action === 'redis-menu-open') openRedisKey(menu.key);
        if (action === 'redis-menu-copy') {
          const value = menu.kind === 'redis-key'
            ? redisKeyClipboard([...state.selectedKeys])
            : redisSelectedClipboard(menu.key, state.selectedEntries);
          copy(value);
        }
        if (action === 'redis-menu-delete') {
          state.redisDeleteTarget = menu.kind === 'redis-key'
            ? {
              db: state.redisDb,
              tabId: state.active,
              keys: [...state.selectedKeys],
            }
            : {
              db: state.redisDb,
              tabId: state.active,
              key: menu.key,
              entries: [...state.selectedEntries].sort((a, b) => a - b).map(
                index => ({ index, row: [...menu.key.rows[index]] }),
              ),
            };
          state.overlay = menu.kind === 'redis-key'
            ? 'delete-key'
            : 'delete-entry';
        }
        state.menu = null;
        render();
        return;
      }
      if (
        [
          'filter',
          'new-row',
          'export',
          'import',
          'transfer',
          'query-file',
          'ttl',
          'rename-key',
          'delete-key',
          'edit-key',
          'add-entry',
          'delete-entry',
          'draft-preview',
        ].includes(action)
      ) {
        if (['import', 'transfer'].includes(action)) state.importPreview = null;
        if (action === 'delete-key') {
          state.redisDeleteTarget = {
            db: state.redisDb,
            tabId: state.active,
            single: true,
            keys: [keySamples.find(k => k.name === state.key)],
          };
        }
        if (action === 'delete-entry') {
          const key = keySamples.find(k => k.name === state.key);
          state.redisDeleteTarget = {
            db: state.redisDb,
            tabId: state.active,
            key,
            entries: [...state.selectedEntries].sort((a, b) => a - b).map(
              index => ({ index, row: [...key.rows[index]] }),
            ),
          };
        }
        state.overlay = action;
        render();
        return;
      }
      if (action === 'clear-filter') {
        delete state.filters[`${state.database}.${state.table}`];
        delete state.sortColumns[`${state.database}.${state.table}`];
        state.overlay = null;
        render();
        return;
      }
      if (action === 'apply-filter') {
        state.filters[`${state.database}.${state.table}`] = {
          column: $('#filter-column').value,
          operator: $('#filter-operator').value,
          value: $('#filter-value').value,
        };
        state.sortColumns[`${state.database}.${state.table}`] = {
          column: $('#sort-column').value,
          desc: $('#sort-direction').value === 'desc',
        };
        state.overlay = null;
        state.selected.clear();
        render();
        return;
      }
      if (action === 'draft-discard' || action === 'draft-commit') {
        const drafts = currentDrafts();
        if (state.provider === 'mysql') {
          drafts.forEach(d => {
            if (d.deletion) deletedRows.delete(d.row);
            else {
              d.row[d.column] = d.before;
              cellOriginals.get(d.row).delete(d.column);
            }
          });
        } else {
          state.drafts = state.drafts.filter(d => !drafts.includes(d));
          const tab = state.tabs.find(item => item.id === state.active);
          if (tab) tab.redisKeyDraft = null;
        }
        state.overlay = null;
        render();
        if (action === 'draft-commit') {
          toast(
            t('submitDemonstrationCompleteNoDatabaseWriteOccurredAndTheSampleWasReset'),
          );
        }
        return;
      }
      if (action === 'stage-delete' || action === 'stage-delete-entry') {
        const target = state.redisDeleteTarget;
        if (
          !target || target.db !== state.redisDb
          || target.tabId !== state.active || state.connectionModes.redis
        ) return;
        if (target.single) {
          const key = target.keys[0];
          state.drafts.push({
            db: target.db,
            key: key.name,
            kind: 'delete',
            label: `DB ${target.db} / ${key.name} / delete`,
            before: key.name,
            after: t('delete'),
          });
        } else if (target.keys) {
          const tab = state.tabs.find(item => item.id === target.tabId);
          if (!tab || tab.redisKeyDraft) {
            toast(t('closeBlocked'));
            return;
          }
          tab.redisKeyDraft = {
            db: target.db,
            keys: [...target.keys],
            kind: 'delete_keys',
            label: `DB ${target.db} / ${target.keys.length} keys`,
            before: target.keys.map(key => key.name),
            after: t('delete'),
          };
        } else {target.entries.forEach(entry =>
            state.drafts.push({
              db: target.db,
              key: target.key.name,
              kind: 'delete-entry',
              row: entry.index,
              label: `DB ${target.db} / ${target.key.name} / ${entry.index}`,
              before: entry.row,
              after: null,
            })
          );}
        state.redisDeleteTarget = null;
        state.overlay = null;
        render();
        return;
      }
      if (action.startsWith('stage-')) {
        const key = keySamples.find(k => k.name === state.key),
          kind = action.slice(6);
        if (!key) return;
        clearFieldErrors();
        for (
          const input of document.querySelectorAll(
            '[id^="redis-edit-"], #redis-new-name',
          )
        ) {
          if (!input.value.startsWith('base64:')) continue;
          try {
            const encoded = input.value.slice(7);
            if (btoa(atob(encoded)) !== encoded) throw new Error();
          } catch {
            fieldError(
              input,
              language === 'zh-CN'
                ? '请输入有效的 Base64。'
                : 'Enter valid Base64.',
            );
            return;
          }
        }
        let before, after;
        if (kind === 'add-entry') {
          before = null;
          after = [...document.querySelectorAll('[id^="redis-edit-"]')].map(
            input => input.value,
          );
          if (
            key.type === 'ZSET'
              && !/^[+-]?(?:inf|(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?)$/i.test(
                after[1],
              )
            || key.type === 'ZSET' && !/^[+-]?inf$/i.test(after[1])
              && !Number.isFinite(Number(after[1]))
          ) {
            fieldError($('#redis-edit-1'), t('enterAValidScore'));
            return;
          }
          if (
            key.type !== 'LIST' && key.rows.some(row => row[0] === after[0])
          ) {
            fieldError($('#redis-edit-0'), t('enterAnUnusedKeyName'));
            return;
          }
        } else if (kind === 'delete-entry') {
          before = [...key.rows[state.redisRow]];
          after = null;
        } else if (kind === 'edit') {
          before = key.type === 'STR'
            ? [key.value]
            : [...key.rows[state.redisRow]];
          after = before.map((_, i) => $(`#redis-edit-${i}`).value);
          if (
            key.type === 'ZSET'
              && !/^[+-]?(?:inf|(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?)$/i.test(
                after[1],
              )
            || key.type === 'ZSET' && !/^[+-]?inf$/i.test(after[1])
              && !Number.isFinite(Number(after[1]))
          ) {
            fieldError($('#redis-edit-1'), t('enterAValidScore'));
            return;
          }
        } else if (kind === 'ttl') {
          if (
            $('#redis-ttl-policy').value === 'set'
            && !/^\d+$/.test($('#redis-ttl-value').value)
          ) {
            fieldError(
              $('#redis-ttl-value'),
              t('enterAValidDurationInSeconds'),
            );
            return;
          }
          before = key.ttl;
          after = $('#redis-ttl-policy').value === 'set'
            ? $('#redis-ttl-value').value + ' s'
            : $('#redis-ttl-policy').value === 'persist'
            ? '∞'
            : key.ttl;
        } else if (kind === 'rename') {
          before = key.name;
          after = $('#redis-new-name').value;
          if (keySamples.some(k => k.name === after && k !== key)) {
            fieldError($('#redis-new-name'), t('enterAnUnusedKeyName'));
            return;
          }
        } else {
          before = key.name;
          after = t('delete');
        }
        state.drafts = state.drafts.filter(d =>
          !(kind !== 'add-entry' && d.db === state.redisDb
            && d.key === state.key && d.kind === kind
            && (!['edit', 'delete-entry'].includes(kind)
              || d.row === state.redisRow))
        );
        if (JSON.stringify(before) !== JSON.stringify(after)) {
          state.drafts.push({
            db: state.redisDb,
            key: state.key,
            kind,
            row: state.redisRow,
            label: `DB ${state.redisDb} / ${key.name} / ${kind}${
              kind === 'edit' ? ' / ' + state.redisRow : ''
            }`,
            before,
            after,
          });
        }
        state.overlay = null;
        render();
        return;
      }
      if (action.startsWith('sql-menu-')) {
        sqlMenuAction(action);
        return;
      }
      if (action.startsWith('profile-settings:')) {
        openConnectionForm('connection-settings', action.split(':')[1]);
        return;
      }
      if (action.startsWith('profile-copy:')) {
        copy(action.split(':')[1] === 'mysql' ? 'Commerce' : 'Cache');
        state.menu = null;
        render();
        return;
      }
      if (action.startsWith('profile-delete:')) {
        const provider = action.split(':')[1];
        if (connectionHasDrafts(provider)) {
          state.menu = null;
          render();
          toast(t('resourceHasDrafts'));
          return;
        }
        state.deleteConnectionTarget = {
          provider,
          context: {
            provider: state.provider,
            active: state.active,
            database: state.database,
            table: state.table,
          },
        };
        state.menu = null;
        state.overlay = 'delete-connection';
        render();
        return;
      }
      if (action.startsWith('resource-')) {
        const target = state.menu;
        state.menu = null;
        if (action === 'resource-delete') {
          if (resourceHasDrafts(target.database, target.table)) {
            render();
            toast(t('resourceHasDrafts'));
            return;
          }
          state.deleteResourceTarget = {
            kind: target.kind,
            database: target.database,
            table: target.table,
            resource: target.kind === 'database'
              ? databases[target.database]
              : databases[target.database]?.[target.table],
            context: {
              provider: state.provider,
              active: state.active,
              database: state.database,
              table: state.table,
            },
          };
          state.overlay = 'delete-resource';
          render();
          return;
        }
        if (action === 'resource-copy') copy(target.table ?? target.database);
        else if (action === 'resource-refresh') {
          render();
          toast(t('resourceRefreshPreview'));
          return;
        } else if (target.kind === 'database') {
          state.expanded.add(target.database);
        } else {
          openTable(target.database, target.table);
          state.section = action === 'resource-structure'
            ? 'structure'
            : action === 'resource-ddl'
            ? 'ddl'
            : 'data';
        }
        render();
        return;
      }
      if (action.startsWith('sql-statement:')) {
        requestSql('statement', Number(action.split(':')[1]));
        return;
      }
      if (action.startsWith('sql-line:')) {
        state.sqlLine = Number(action.split(':')[1]);
        state.overlay = 'sql-line';
        render();
        return;
      }
      if (action.startsWith('close-tab:')) {
        if (closeTabs([Number(action.split(':')[1])])) render();
        return;
      }
      if (action.startsWith('tabs-') && state.menu?.kind === 'tab') {
        const index = state.tabs.findIndex(tab => tab.id === state.menu.tabId);
        if (index < 0) {
          state.menu = null;
          render();
          return;
        }
        const targets = action === 'tabs-left'
          ? state.tabs.slice(0, index)
          : action === 'tabs-right'
          ? state.tabs.slice(index + 1)
          : state.tabs;
        if (closeTabs(targets.map(tab => tab.id))) render();
        return;
      }
      switch (action) {
        case 'request-preview-import':
        case 'request-import':
        case 'request-export':
        case 'request-file-open':
        case 'request-file-save': {
          const preview = $('#request-preview');
          const path = $('#transfer-path') || $('#query-file-path');
          if (!validateTransfer(path)) return;
          if (
            action === 'request-preview-import' || action === 'request-import'
          ) {
            const signature = JSON.stringify([
              state.provider,
              state.database,
              state.table,
              state.redisDb,
              state.key,
              ...[
                'transfer-path',
                'transfer-format',
                'transfer-mapping',
                'transfer-null',
                'transfer-escape',
                'transfer-binary',
              ].map(id => document.getElementById(id)?.value),
            ]);
            if (
              action === 'request-import' && state.importPreview !== signature
            ) {
              preview.hidden = false;
              preview.textContent = language === 'zh-CN'
                ? '请先使用当前参数预览导入。'
                : 'Preview the import with the current parameters first.';
              return;
            }
            if (action === 'request-preview-import') {
              state.importPreview = signature;
            }
          }
          preview.hidden = false;
          preview.textContent =
            `${button.textContent.trim()} · ${path.value} · ${
              t('requestPreviewOnly')
            }`;
          break;
        }
        case 'app-settings':
          captureLanguageInputs();
          state.overlay = 'app-settings';
          state.menu = null;
          render();
          break;
        case 'shortcut-help':
          state.menu = null;
          state.overlay = 'shortcut-help';
          render();
          break;
        case 'navigation-toggle':
          state.compact = !state.compact;
          if (!state.narrow) state.wideCompact = state.compact;
          render();
          break;
        case 'confirm-delete-resource': {
          const target = state.deleteResourceTarget;
          const resource = target?.kind === 'database'
            ? databases[target.database]
            : databases[target?.database]?.[target?.table];
          const valid = target && state.connections.has('mysql')
            && target.context.provider === 'mysql'
            && resource && resource === target.resource

        const current = items.indexOf(document.activeElement);
        const index = current < 0
          ? (event.key === 'ArrowDown' ? 0 : items.length - 1)

            % items.length;

          finishCellEdit(event.key !== 'Escape');

        if (search) state.connectionForm.dbSearch = search.value;
        document.querySelectorAll('[data-database-choice]').forEach(choice => {
          if (choice.checked) {
            state.connectionForm.selectedDatabases.add(
              choice.dataset.databaseChoice,
            );
          } else {state.connectionForm.selectedDatabases.delete(
              choice.dataset.databaseChoice,
            );}
        });
      }
      for (
        const [id, property] of [
          ['object-filter', 'objectFilter'],
          ['row-filter', 'rowFilter'],
          ['key-filter', 'keyFilter'],
          ['cli-command', 'cliText'],
        ]
      ) {
        const field = document.getElementById(id);
        if (field) state[property] = field.value;
      }
    }
    window.matchMedia('(max-width: 760px)').addEventListener(
      'change',
      event => {
        state.narrow = event.matches;
        state.compact = event.matches ? true : state.wideCompact;
        render();
      },
    );
    window.addEventListener('languagechange', () => {
      if (languagePreference !== 'system') return;
      captureLanguageInputs();
      language = systemLanguage();
      translatePreview();
      render();
    });
    document.documentElement.dataset.theme = $('#preview-theme').value;
    window.addEventListener('resize', () => requestAnimationFrame(fitGrid));
    translatePreview();
    render();
    </script>
  </body>
</html>
