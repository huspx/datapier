<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datapier · UI 设计稿</title>
    <link rel="stylesheet" href="assets/ui-redesign/base.css">
    <link rel="stylesheet" href="assets/ui-redesign/navigation.css">
    <link rel="stylesheet" href="assets/ui-redesign/workspace.css">
    <link rel="stylesheet" href="assets/ui-redesign/sql.css">
    <link rel="stylesheet" href="assets/ui-redesign/redis-cli.css">
    <link rel="stylesheet" href="assets/ui-redesign/dialogs-responsive.css">
    <link rel="stylesheet" href="assets/ui-redesign/workbench-overrides.css">
    <link rel="stylesheet" href="assets/ui-redesign/archery.css">
  </head>
  <body>
    <div class="preview">
      <strong>Datapier <span class="muted">/ UI 设计稿</span></strong>
      <select id="preview-source" aria-label="预览连接来源">
        <option value="direct">Direct</option>
        <option value="archery">Archery</option>
      </select>
      <select id="preview-provider" aria-label="预览数据库类型">
        <option value="mysql">MySQL</option>
        <option value="redis">Redis</option>
      </select>
      <select id="preview-state" aria-label="预览交互状态">
        <option value="default">浏览</option>
        <option value="empty-connections">连接 · 空状态</option>
        <option value="query-editor">SQL · 编辑器</option>
        <option value="query-result">SQL · 结果样例</option>
        <option value="ddl">SQL · DDL 高亮</option>
        <option value="task">任务详情</option>
        <option value="error">错误详情</option>
        <option value="draft">草稿详情</option>
        <option value="import">导入预览详情</option>
        <option value="schema">结构详情</option>
        <option value="restore">恢复详情</option>
        <option value="cli-success">CLI · 执行记录</option>
        <option value="cli-empty">CLI · 空结果</option>
        <option value="cli-running">CLI · 执行中</option>
        <option value="cli-error">CLI · 错误</option>
        <option value="connection-connected">连接 · 已连接</option>
        <option value="connection-connecting">连接 · 连接中</option>
        <option value="connection-failed">连接 · 失败</option>
        <option value="connection-disconnected">连接 · 未连接</option>
        <option value="archery-login">Archery · 服务登录</option>
        <option value="archery-totp">Archery · 验证码</option>
        <option value="archery-instances">Archery · 选择实例</option>
        <option value="archery-server">Archery · 服务器管理</option>
        <option value="archery-server-edit">Archery · 编辑服务器</option>
        <option value="archery-preview">Archery · 连接预览</option>
        <option value="archery-edit">Archery · 编辑连接</option>
        <option value="archery-management-busy">Archery · 其他窗口占用</option>
        <option value="archery-management-missing">Archery · 实例不可见</option>
        <option value="archery-query">Archery · 查询结果</option>
        <option value="archery-redis">Archery · Redis 命令</option>
        <option value="archery-history">Archery · 平台历史</option>
        <option value="archery-check">Archery · 上线 SQL 检查</option>
        <option value="archery-auth">Archery · 认证失效</option>
        <option value="archery-denied">Archery · 权限拒绝</option>
        <option value="archery-running">Archery · 任务运行中</option>
        <option value="archery-unknown">Archery · 远端状态未知</option>
        <option value="insert-output">查看最近复制的 INSERT</option>
      </select>
      <select id="preview-theme" aria-label="Preview theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <span class="spacer"></span><span class="muted small preview-note"
      >示例数据 · 不连接数据库 · 交互设计预览</span>
    </div>
    <div id="app" class="shell"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/sql-formatter@15.9.0/dist/sql-formatter.min.js"
      integrity="sha256-+VrFvZ1CRzKIfHdQhS5BvkqJFgi3T/ZvXHOrA6NbWMA="
      crossorigin="anonymous"
    ></script>
    <script src="assets/ui-redesign/validation.js"></script>
    <script src="assets/ui-redesign/i18n.js"></script>
    <script src="assets/ui-redesign/icons.js"></script>
    <script src="assets/ui-redesign/data-state.js"></script>
    <script src="assets/ui-redesign/sql.js"></script>
    <script src="assets/ui-redesign/navigation.js"></script>
    <script src="assets/ui-redesign/grid.js"></script>
    <script src="assets/ui-redesign/history-drafts.js"></script>
    <script src="assets/ui-redesign/redis-data.js"></script>
    <script src="assets/ui-redesign/forms.js"></script>
    <script src="assets/ui-redesign/workspaces.js"></script>
    <script src="assets/ui-redesign/cli.js"></script>
    <script src="assets/ui-redesign/dialogs-menus.js"></script>
    <script src="assets/ui-redesign/archery-state.js"></script>
    <script src="assets/ui-redesign/archery-management.js"></script>
    <script src="assets/ui-redesign/archery-render.js"></script>
    <script src="assets/ui-redesign/archery-events.js"></script>
    <script src="assets/ui-redesign/render-actions.js"></script>
    <script src="assets/ui-redesign/click-events.js"></script>
    <script src="assets/ui-redesign/input-events.js"></script>
    <script src="assets/ui-redesign/bootstrap.js"></script>
  </body>
</html>
