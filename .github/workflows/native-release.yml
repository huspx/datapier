name: Native builds and release bundles
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# 同一分支串行，避免不同 main 提交混用同版本草稿中的资源。
concurrency:
  group: native-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Check plugin version synchronization
        run: python scripts/sync-version.py --check
      - name: Test release scripts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install dprint
        run: npm install --global dprint@0.64.3
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check changed files with dprint
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          # 手动触发和新分支没有有效 before；根提交则检查全部新增文件。
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if git rev-parse --verify --quiet HEAD^ > /dev/null; then
              base=HEAD^
            fi
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- > "$RUNNER_TEMP/dprint-files"
          else
            git ls-files -z > "$RUNNER_TEMP/dprint-files"
          fi
          if [[ -s "$RUNNER_TEMP/dprint-files" ]]; then
            files=()
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < "$RUNNER_TEMP/dprint-files"
            dprint check --config ./dprint.json --config-discovery=false --allow-no-files -- "${files[@]}"
          fi
  native:
    name: Native ${{ matrix.target }}
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy: &native-strategy
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    uses: ./.github/workflows/native-build.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
  prepare-release:
    name: Prepare draft release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: format
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Prepare version draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/draft_release.py prepare
  native-release:
    name: Native ${{ matrix.target }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: prepare-release
    permissions:
      contents: write
    strategy: *native-strategy
    uses: ./.github/workflows/native-build.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      release-id: ${{ needs.prepare-release.outputs.release-id }}
  bundle:
    name: Complete draft release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [prepare-release, native-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Assemble from draft assets and upload final files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        run: python scripts/draft_release.py assemble --release-id "$DRAFT_RELEASE_ID"
