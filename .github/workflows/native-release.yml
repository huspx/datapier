name: Native builds and release bundles
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install dprint
        run: npm install --global dprint@0.64.3
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check changed files with dprint
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          # 手动触发和新分支没有有效 before；根提交则检查全部新增文件。
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if git rev-parse --verify --quiet HEAD^ > /dev/null; then
              base=HEAD^
            fi
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- > "$RUNNER_TEMP/dprint-files"
          else
            git ls-files -z > "$RUNNER_TEMP/dprint-files"
          fi
          if [[ -s "$RUNNER_TEMP/dprint-files" ]]; then
            files=()
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < "$RUNNER_TEMP/dprint-files"
            dprint check --config ./dprint.json --config-discovery=false --allow-no-files -- "${files[@]}"
          fi
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Verify native runner architecture
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $expected = if ('${{ matrix.target }}'.StartsWith('aarch64-')) { 'Arm64' } else { 'X64' }
          if ($arch -ne $expected) { throw "Expected native $expected runner, got $arch" }
      - name: Run native unit tests
        run: cargo test --workspace --target ${{ matrix.target }} --locked
      - name: Build native executable
        run: cargo build --release --package datapier --target ${{ matrix.target }} --locked
      - name: Smoke native executable
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $nativeBinary = Join-Path $PWD "target/${{ matrix.target }}/release/datapier$extension"
          $versionOutput = & $nativeBinary --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -cne 'datapier 0.1.0') { throw 'Native CLI smoke failed' }
      - name: Package binary
        shell: pwsh
        run: ./scripts/package-target.ps1 -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: datapier-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  bundle:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: datapier-*
          path: dist
          merge-multiple: true
      - name: Assemble plugin and checksums
        shell: pwsh
        run: ./scripts/assemble-release.ps1 -Artifacts dist
      - uses: actions/upload-artifact@v7
        with:
          name: datapier-0.1.0-release
          path: dist/*
          if-no-files-found: error
