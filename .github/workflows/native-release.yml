name: Native builds and release bundles
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Check plugin version synchronization
        run: python scripts/sync-version.py --check
      - name: Test release scripts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install dprint
        run: npm install --global dprint@0.64.3
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check changed files with dprint
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          # 手动触发和新分支没有有效 before；根提交则检查全部新增文件。
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if git rev-parse --verify --quiet HEAD^ > /dev/null; then
              base=HEAD^
            fi
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- > "$RUNNER_TEMP/dprint-files"
          else
            git ls-files -z > "$RUNNER_TEMP/dprint-files"
          fi
          if [[ -s "$RUNNER_TEMP/dprint-files" ]]; then
            files=()
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < "$RUNNER_TEMP/dprint-files"
            dprint check --config ./dprint.json --config-discovery=false --allow-no-files -- "${files[@]}"
          fi
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Read product version
        id: product-version
        shell: bash
        run: |
          version=$(python scripts/version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Verify native runner architecture
        shell: python
        run: |
          import platform
          machine = platform.machine().lower()
          expected = 'arm64' if '${{ matrix.target }}'.startswith('aarch64-') else 'x64'
          actual = {'arm64': 'arm64', 'aarch64': 'arm64', 'x86_64': 'x64', 'amd64': 'x64'}.get(machine, machine)
          if actual != expected:
              raise RuntimeError(f'Expected native {expected} runner, got {machine}')
      - name: Run native unit tests
        run: cargo test --workspace --target ${{ matrix.target }} --locked
      - name: Build native executable
        run: cargo build --release --package datapier --target ${{ matrix.target }} --locked
      - name: Smoke native executable
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          extension = '.exe' if sys.platform == 'win32' else ''
          binary = pathlib.Path('target/${{ matrix.target }}/release') / ('datapier' + extension)
          result = subprocess.run([str(binary), '--version'], capture_output=True, text=True, check=True)
          if result.stdout.strip() != 'datapier ${{ steps.product-version.outputs.version }}':
              raise RuntimeError('Native CLI smoke failed')
      - name: Package binary
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: python scripts/package-target.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: datapier-${{ steps.product-version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  bundle:
    if: github.ref == 'refs/heads/main'
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Read product version
        id: product-version
        shell: bash
        run: |
          version=$(python scripts/version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: datapier-*
          path: dist
          merge-multiple: true
      - name: Assemble plugin and checksums
        run: python scripts/assemble-release.py --artifacts dist
      - uses: actions/upload-artifact@v7
        with:
          name: datapier-${{ steps.product-version.outputs.version }}-release
          path: dist/*
          if-no-files-found: error
