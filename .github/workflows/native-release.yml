name: Native builds and release bundles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Verify native runner architecture
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $expected = if ('${{ matrix.target }}'.StartsWith('aarch64-')) { 'Arm64' } else { 'X64' }
          if ($arch -ne $expected) { throw "Expected native $expected runner, got $arch" }
      - name: Run native unit tests
        run: cargo test --workspace --target ${{ matrix.target }} --locked
      - name: Build native executable
        run: cargo build --release --package datapier --target ${{ matrix.target }} --locked
      - name: Smoke native executable
        shell: pwsh
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $nativeBinary = Join-Path $PWD "target/${{ matrix.target }}/release/datapier$extension"
          $versionOutput = & $nativeBinary --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -cne 'datapier 0.1.0') { throw 'Native CLI smoke failed' }
      - name: Package binary
        shell: pwsh
        run: ./scripts/package-target.ps1 -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: datapier-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  bundle:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: datapier-*
          path: dist
          merge-multiple: true
      - name: Assemble plugin and checksums
        shell: pwsh
        run: ./scripts/assemble-release.ps1 -Artifacts dist
      - uses: actions/upload-artifact@v4
        with:
          name: datapier-0.1.0-release
          path: dist/*
          if-no-files-found: error
