name: Native target build
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      release-id:
        default: ""
        type: string
# 权限由调用方传入：PR 为只读，仅 main 的草稿上传任务具有 contents: write。
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Read product version
        id: product-version
        run: |
          version=$(python scripts/version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Verify native runner architecture
        shell: python
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          import os
          import platform
          machine = platform.machine().lower()
          expected = 'arm64' if os.environ['BUILD_TARGET'].startswith('aarch64-') else 'x64'
          actual = {'arm64': 'arm64', 'aarch64': 'arm64', 'x86_64': 'x64', 'amd64': 'x64'}.get(machine, machine)
          if actual != expected:
              raise RuntimeError(f'Expected native {expected} runner, got {machine}')
      - name: Run native unit tests
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: cargo test --workspace --target "$BUILD_TARGET" --locked
      - name: Build native executable
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: cargo build --release --package datapier --target "$BUILD_TARGET" --locked
      - name: Smoke native executable
        shell: python
        env:
          BUILD_TARGET: ${{ inputs.target }}
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version }}
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          extension = '.exe' if sys.platform == 'win32' else ''
          binary = pathlib.Path('target') / os.environ['BUILD_TARGET'] / 'release' / ('datapier' + extension)
          result = subprocess.run([str(binary), '--version'], capture_output=True, text=True, check=True)
          if result.stdout.strip() != 'datapier ' + os.environ['PRODUCT_VERSION']:
              raise RuntimeError('Native CLI smoke failed')
          for command in ('tui', 'tsp', 'mcp', 'engine'):
              subprocess.run([str(binary), command, '--help'], capture_output=True, text=True, check=True)
      - name: Package binary
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: python scripts/package-target.py --target "$BUILD_TARGET"
      - name: Upload directly to draft release
        if: inputs.release-id != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_RELEASE_ID: ${{ inputs.release-id }}
          BUILD_TARGET: ${{ inputs.target }}
        run: python scripts/draft_release.py upload-target --release-id "$DRAFT_RELEASE_ID" --target "$BUILD_TARGET"
